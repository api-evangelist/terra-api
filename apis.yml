aid: terra-api
url: https://raw.githubusercontent.com/api-evangelist/terra-api/refs/heads/main/apis.yml
name: Terra
kind: company
description: >-
  Terra is a unified wearables and health-data API that aggregates data from
  500+ wearables, fitness trackers, and health apps - Garmin, Fitbit, Oura,
  Apple Health, Whoop, Strava, Google Fit, Polar, Withings, and many more -
  behind a single normalized REST interface. Developers connect end users
  through the Terra Widget or a custom authentication flow, then receive
  normalized Activity, Body, Daily, Sleep, Nutrition, Menstruation, and Athlete
  data. Terra's primary delivery model is asynchronous - requested and newly
  available health data is streamed to a developer-configured webhook
  destination rather than returned inline, with REST read endpoints available
  for on-demand historical pulls.
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
