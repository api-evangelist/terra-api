apis:
- aid: terra-api:terra-api-webhooks
  name: Terra Webhooks
  tags:
  - Webhooks
  - Data Streaming
  - Events
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://docs.tryterra.co/health-and-fitness-api/integration-setup/setting-up-data-destinations/webhooks
  baseURL: https://api.tryterra.co/v2
  properties:
  - url: >-
      https://docs.tryterra.co/health-and-fitness-api/integration-setup/setting-up-data-destinations/webhooks
    type: Documentation
  - url: https://docs.tryterra.co/reference/health-and-fitness-api/event-types
    type: APIReference
  description: >-
    Terra's primary data-delivery mechanism. Rather than a polling or WebSocket transport, Terra streams
    normalized health data and lifecycle events - auth, deauth, connection errors, and activity/body/daily/sleep/nutrition/
    menstruation payloads - by HTTP POST to a developer-configured webhook endpoint, signed for verification.
    Historical data requests with to_webhook=true are fulfilled asynchronously to this same destination.
