description: >-
  FinOps view of Terra spend. Terra bills the Unified Health & Fitness API on a
  usage-based credit model above a monthly included allowance (100,000 credits).
  The two dominant cost drivers are active authentications (connected users, ~200
  credits/user/month) and data events (first 400 free per authentication, then
  0.5 credits/event); a separate Blood Report API meters on biomarkers. Because
  cost scales with both connected users and event volume, the primary
  optimization levers are which data scopes you enable per user and how much
  historical/streamed data you actually consume.
notes: >-
  Per-unit rates ($0.005 then $0.003 per credit) reflect the public pricing page
  as of the created date; verify on tryterra.co/pricing during reconciliation.
  Watch the day-budget rate-limit interaction: wide historical backfills consume
  read budget, while ongoing costs are driven by connected users and events.
