meters:
- name: credits
  description: Unified billing unit; 100,000 included per month, then $0.005 (to 1M) / $0.003 (1M+) per credit.
  unit: credits
  aggregation: sum
  dimensions:
  - account
  - resource
- name: active_authentications
  description: Connected users with an active authentication, ~200 credits per user per month.
  unit: users
  aggregation: sum
  dimensions:
  - account
  - provider
- name: data_events
  description: Data events delivered; first 400 free per active authentication, then 0.5 credits each.
  unit: events
  aggregation: sum
  dimensions:
  - account
  - user
  - dataType
- name: biomarkers
  description: Biomarkers returned by the Blood Report API; first 3,500 free, then 30 credits each.
  unit: biomarkers
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track credits by active authentications versus data events, and by data type (activity/body/daily/sleep/nutrition/menstruation), to see what drives spend.
- name: Allocation
  description: Tag connected users with your reference_id per customer/team so credit consumption maps to internal cost centers.
- name: Optimization
  description: Enable only the data scopes each user needs, prefer webhook delivery over repeated historical pulls, and chunk backfills to respect the day-budget rate limit and avoid re-fetching data.
- name: Accountability
  description: Review monthly credit burn against the 100,000 included allowance; use the 30-day money-back window and first-six-month spike protection when testing errors inflate usage.
